[project]
name = "kolo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yan Shytyk", email = "shytyk.develop@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "livekit-api>=1.2.2",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.40.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# ASYNC catches blocking calls in async functions
select = ["E", "F", "I", "B", "UP", "ASYNC"]
