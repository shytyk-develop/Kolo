name: CI
on: [push, pull_request]

# the jobs only read the code: a compromised step can't push or touch releases
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q --cov=kolo --cov-report=term

  # The frontend job from the book goes here once frontend/ has a package.json (chapter 16):
  # without it "npm ci" fails and the whole CI run turns red.
