name: CI
on: [push, pull_request]

# read-only token for the jobs
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"  # same as .python-version and Dockerfile
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q --cov=kolo --cov-report=term

  # todo: frontend job (npm ci) after ch16, frontend/ is empty for now
